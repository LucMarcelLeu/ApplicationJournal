services:
  postgres:
    image: postgres:17
    container_name: applicationjournal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: applicationjournal-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@applicationjournal.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - applicationjournal-pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped

  api:
    build:
      context: ./backend/ApplicationJournal.Api
      dockerfile: Dockerfile
    container_name: applicationjournal-api
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      DocumentStorage__Path: /app/storage/documents
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5132:8080"
    volumes:
      - ./storage/documents:/app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/application-journal-ui
      dockerfile: Dockerfile
    container_name: applicationjournal-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  applicationjournal-pgadmin-data: